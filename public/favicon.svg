  <rect width="64" height="64" rx="14" fill="#FAFAF8" stroke="#E5E7E2" stroke-width="2" />
  
  <!-- Architectural Geometric "HA" Monogram -->
  <path d="M18 18 L18 46" stroke="#202321" stroke-width="4" stroke-linecap="square" />
