<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SkillHub Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root{
--bg-base:#0f172a;
--bg-top:#111827;
--bg-bottom:#0b1120;
--surface:#f8fafc;
--surface-soft:#eef2ff;
--surface-muted:#dbe4ff;
--text:#0f172a;
--text-muted:#5b6478;
--accent:#f97316;
--accent-strong:#ea580c;
--ok:#14b8a6;
--danger:#ef4444;
--ring:rgba(249,115,22,0.3);
--shadow-lg:0 18px 45px rgba(0,0,0,0.3);
--shadow-card:0 14px 30px rgba(15,23,42,0.12);
}

*{box-sizing:border-box}

body{
margin:0;
font-family:"Space Grotesk",system-ui,sans-serif;
background:
radial-gradient(circle at 10% 10%,rgba(20,184,166,0.18),transparent 30%),
radial-gradient(circle at 80% 0%,rgba(249,115,22,0.18),transparent 35%),
linear-gradient(165deg,var(--bg-top),var(--bg-bottom));
color:var(--text);
min-height:100vh;
}

.app{
max-width:1200px;
margin:32px auto;
padding:18px;
}

.header{
background:linear-gradient(140deg,rgba(15,23,42,0.92),rgba(30,41,59,0.9));
backdrop-filter:blur(8px);
border:1px solid rgba(148,163,184,0.18);
border-radius:22px;
padding:18px 22px;
color:#e2e8f0;
display:flex;
justify-content:space-between;
align-items:center;
gap:16px;
box-shadow:var(--shadow-lg);
margin-bottom:20px;
}

.brand h2{
margin:0;
font-size:1.35rem;
letter-spacing:0.2px;
}

.brand p{
margin:6px 0 0;
font-size:0.9rem;
color:#94a3b8;
}

.container{
display:grid;
grid-template-columns:270px 1fr;
gap:18px;
}

.sidebar,
.main-card{
background:linear-gradient(160deg,rgba(248,250,252,0.98),rgba(238,242,255,0.98));
border:1px solid rgba(15,23,42,0.08);
border-radius:18px;
box-shadow:var(--shadow-card);
}

.sidebar{
padding:18px;
position:sticky;
top:20px;
height:fit-content;
}

.sidebar select{
width:100%;
padding:11px 12px;
border-radius:12px;
border:1px solid #cbd5e1;
background:#fff;
font-weight:600;
font-family:inherit;
margin-bottom:14px;
outline:none;
}

.sidebar select:focus,
input:focus,
textarea:focus{
border-color:var(--accent);
box-shadow:0 0 0 4px var(--ring);
}

.nav button{
width:100%;
margin-bottom:9px;
padding:12px 13px;
border:1px solid transparent;
border-radius:12px;
background:#e2e8f0;
color:#1e293b;
cursor:pointer;
font-family:inherit;
font-weight:700;
text-align:left;
transition:transform 0.22s ease,background 0.22s ease,color 0.22s ease;
}

.nav button:hover{
background:var(--accent);
color:#fff;
transform:translateX(4px);
}

.nav button.active{
background:linear-gradient(135deg,var(--accent),var(--accent-strong));
color:#fff;
}

.main-card{
padding:24px;
animation:cardIn 0.35s ease;
}

@keyframes cardIn{
from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:translateY(0)}
}

h3{
margin:0 0 16px;
font-size:1.15rem;
color:#0f172a;
}

.stat-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:14px;
}

.stat-card{
background:#fff;
padding:18px 16px;
border-radius:14px;
border:1px solid #e2e8f0;
box-shadow:0 8px 18px rgba(15,23,42,0.08);
text-align:center;
transition:transform 0.2s ease,border-color 0.2s ease;
}

.stat-card:hover{
transform:translateY(-3px);
border-color:#94a3b8;
}

.stat-card h2{
margin:0;
font-size:1.9rem;
color:var(--accent-strong);
}

.stat-card p{
margin:8px 0 0;
color:var(--text-muted);
font-weight:600;
}

input,
textarea{
width:100%;
padding:11px 12px;
border-radius:12px;
border:1px solid #cbd5e1;
margin-bottom:12px;
font-family:inherit;
font-size:0.96rem;
outline:none;
background:#fff;
transition:border-color 0.2s ease,box-shadow 0.2s ease;
}

textarea{
resize:vertical;
min-height:92px;
}

.btn{
background:linear-gradient(135deg,var(--accent),var(--accent-strong));
color:#fff;
border:none;
padding:10px 16px;
border-radius:12px;
cursor:pointer;
font-family:inherit;
font-weight:700;
transition:transform 0.2s ease,filter 0.2s ease;
}

.btn:hover{
transform:translateY(-1px);
filter:brightness(1.05);
}

.skill{
background:#fff;
padding:14px;
border-radius:14px;
margin-bottom:12px;
border:1px solid #e2e8f0;
box-shadow:0 7px 14px rgba(15,23,42,0.08);
}

.skill p{
margin:8px 0 0;
color:var(--text-muted);
line-height:1.45;
}

.progress{
height:10px;
background:#e2e8f0;
border-radius:999px;
margin-top:10px;
overflow:hidden;
}

.progress i{
display:block;
height:100%;
background:linear-gradient(90deg,var(--ok),#0ea5e9);
border-radius:999px;
}

.cert-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
}

.cert{
background:#fff;
border-radius:12px;
border:1px solid #e2e8f0;
padding:6px;
}

.cert img{
width:100%;
height:120px;
object-fit:cover;
border-radius:9px;
display:block;
transition:transform 0.2s ease;
}

.cert img:hover{
transform:scale(1.03);
}

@media (max-width:920px){
.container{grid-template-columns:1fr}
.sidebar{position:static}
}
</style>
</head>

<body>
<div class="app">

<div class="header">
<div class="brand">
<h2>CodexGenz Portfolio</h2>
<p>Fresh modern layout for profile, skills, and projects</p>
</div>
<button class="btn" id="downloadResume">Download Resume</button>
</div>

<div class="container">

<div class="sidebar">
<select id="userSelect">
<option value="Hasan">Hasan</option>
<option value="Riyaz">Riyaz</option>
<option value="thiyaku">thiyaku</option>
</select>

<div class="nav">
<button class="active" data-view="dashboard">Dashboard</button>
<button data-view="profile">Profile</button>
<button data-view="skills">Skills</button>
<button data-view="projects">Projects</button>
<button data-view="certificates">Certificates</button>
</div>
</div>

<div id="dashboard" class="main-card view">
<h3>Dashboard Overview</h3>
<div class="stat-grid" id="stats"></div>
</div>

<div id="profile" class="main-card view" style="display:none">
<h3>Edit Profile</h3>
<input id="nameInput" placeholder="Name"/>
<input id="deptInput" placeholder="Department"/>
<input id="yearInput" placeholder="Year"/>
<input id="emailInput" placeholder="Email"/>
<button class="btn" id="saveProfile">Save Profile</button>
</div>

<div id="skills" class="main-card view" style="display:none">
<h3>Skills</h3>
<input id="skillName" placeholder="Skill name"/>
<input id="skillLevel" type="number" placeholder="Level 0-100"/>
<button class="btn" id="addSkill">Add Skill</button>
<div id="skillsList"></div>
</div>

<div id="projects" class="main-card view" style="display:none">
<h3>Projects</h3>
<input id="projTitle" placeholder="Project Title"/>
<textarea id="projDesc" placeholder="Description"></textarea>
<button class="btn" id="addProject">Add Project</button>
<div id="projectsList"></div>
</div>

<div id="certificates" class="main-card view" style="display:none">
<h3>Certificates</h3>
<input type="file" id="certUpload"/>
<div class="cert-grid" id="certGrid"></div>
</div>

</div>
</div>

<script>
const storageKey="skillhub-pro-v1";

const defaultUsers={
Hasan:{profile:{name:"Hasan",dept:"Computer Engg",year:"2nd Year",email:"hasanprvxt@gmail.com"},skills:[],projects:[],certificates:[]},
Riyaz:{profile:{name:"Riyaz",dept:"Computer Engg",year:"2nd Year",email:"mohammedumarriyaz@gmail.com"},skills:[],projects:[],certificates:[]},
thiyaku:{profile:{name:"thiyaku",dept:"Computer Engg",year:"2nd Year",email:"thiyaku@gmail.com"},skills:[],projects:[],certificates:[]}
};

function readData(){
const raw=localStorage.getItem(storageKey);
return raw?JSON.parse(raw):JSON.parse(JSON.stringify(defaultUsers));
}
function saveData(d){localStorage.setItem(storageKey,JSON.stringify(d));}

let allUsers=readData();
let activeUser="Hasan";
let data=allUsers[activeUser];

document.getElementById("userSelect").addEventListener("change",e=>{
activeUser=e.target.value;
data=allUsers[activeUser];
renderAll();
});

document.querySelectorAll(".nav button").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".view").forEach(v=>v.style.display="none");
document.querySelectorAll(".nav button").forEach(b=>b.classList.remove("active"));
document.getElementById(btn.dataset.view).style.display="block";
btn.classList.add("active");
};
});

function renderDashboard(){
document.getElementById("stats").innerHTML=`
<div class="stat-card"><h2>${data.skills.length}</h2><p>Skills</p></div>
<div class="stat-card"><h2>${data.projects.length}</h2><p>Projects</p></div>
<div class="stat-card"><h2>${data.certificates.length}</h2><p>Certificates</p></div>
`;
}

saveProfile.onclick=()=>{
data.profile.name=nameInput.value;
data.profile.dept=deptInput.value;
data.profile.year=yearInput.value;
data.profile.email=emailInput.value;
allUsers[activeUser]=data;
saveData(allUsers);
renderAll();
};

addSkill.onclick=()=>{
if(!skillName.value)return;
data.skills.push({name:skillName.value,level:skillLevel.value||0});
allUsers[activeUser]=data;
saveData(allUsers);
skillName.value="";skillLevel.value="";
renderAll();
};

function renderSkills(){
skillsList.innerHTML="";
data.skills.forEach(s=>{
skillsList.innerHTML+=`
<div class="skill">
<strong>${s.name}</strong>
<div class="progress"><i style="width:${s.level}%"></i></div>
</div>`;
});
}

addProject.onclick=()=>{
if(!projTitle.value||!projDesc.value)return;
data.projects.push({title:projTitle.value,desc:projDesc.value});
allUsers[activeUser]=data;
saveData(allUsers);
projTitle.value="";projDesc.value="";
renderAll();
};

function renderProjects(){
projectsList.innerHTML="";
data.projects.forEach(p=>{
projectsList.innerHTML+=`
<div class="skill">
<strong>${p.title}</strong>
<p>${p.desc}</p>
</div>`;
});
}

certUpload.onchange=e=>{
const f=e.target.files[0];
if(!f)return;
const reader=new FileReader();
reader.onload=()=>{
data.certificates.push({src:reader.result});
allUsers[activeUser]=data;
saveData(allUsers);
renderAll();
};
reader.readAsDataURL(f);
};

function renderCerts(){
certGrid.innerHTML="";
data.certificates.forEach(c=>{
certGrid.innerHTML+=`<div class="cert"><img src="${c.src}"/></div>`;
});
}

downloadResume.onclick=()=>{
window.print();
};

function renderAll(){
renderDashboard();
renderSkills();
renderProjects();
renderCerts();
}

renderAll();
</script>
</body>
</html>
